      tags:
      - newsletter
  /newsletter/subscribe:
    post:
      consumes:
      - application/json
      description: Subscribe an email address to the newsletter
      operationId: subscribeNewsletter
      parameters:
      - description: Subscription data
        in: body
        name: subscription
        required: true
        schema:
          $ref: '#/definitions/models.NewsletterSubscribeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.NewsletterResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Subscribe to newsletter
      tags:
      - newsletter
  /newsletter/unsubscribe:
    post:
      consumes:
      - application/json
      description: Remove an email address from the newsletter
      operationId: unsubscribeNewsletter
      parameters:
      - description: Unsubscribe data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.NewsletterUnsubscribeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Unsubscribe from newsletter
      tags:
      - newsletter
  /plans:
