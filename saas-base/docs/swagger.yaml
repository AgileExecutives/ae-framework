      security:
      - BearerAuth: []
      summary: Get all newsletter subscribers
      tags:
      - newsletter
  /newsletter/{id}:
    delete:
      description: Permanently delete a subscriber record (admin only)
      operationId: deleteNewsletterSubscriber
      parameters:
      - description: Subscriber ID
        in: path
        name: id
        required: true
        type: integer
      produces:
