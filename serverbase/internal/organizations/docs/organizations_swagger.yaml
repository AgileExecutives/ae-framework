        type: string
      bankaccount_iban:
        type: string
      bankaccount_owner:
        type: string
      city:
        type: string
      created_at:
        type: string
      date_format:
        type: string
      email:
        type: string
      extra_efforts_billing_mode:
        type: string
      extra_efforts_config:
        type: object
      id:
        type: integer
      invoice_content:
        type: object
      legal_notice_url:
        type: string
      line_item_double_unit_text:
        type: string
      line_item_single_unit_text:
        type: string
      locale:
        type: string
      logo_content_type:
        type: string
      logo_print_content_type:
        type: string
      name:
        type: string
      owner_name:
        type: string
      owner_title:
        type: string
      phone:
        type: string
      privacy_policy_url:
        type: string
      street_address:
        type: string
      tax_id:
        type: string
      tax_rate:
        type: number
      tax_ustid:
        type: string
      tenant_id:
        type: integer
      time_format:
        type: string
      unit_price:
        type: number
      updated_at:
        type: string
      zip:
        type: string
    type: object
  models.UpdateOrganizationRequest:
    properties:
      additional_payment_methods:
        type: object
      bankaccount_bank:
        example: Deutsche Bank
        type: string
      bankaccount_bic:
        example: DEUTDEFF
        type: string
      bankaccount_iban:
        example: DE89370400440532013000
        type: string
      bankaccount_owner:
        example: Acme Corporation
        type: string
      city:
        example: New York
        type: string
      email:
        example: info@acme.com
        type: string
      invoice_content:
        type: object
      legal_notice_url:
        example: https://example.com/legal
