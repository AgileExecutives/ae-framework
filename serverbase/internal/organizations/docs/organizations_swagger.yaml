info:
  contact: {}
  description: Organization management endpoints.
  title: Organizations API
  version: 1.0.0
paths:
  /organization/logo:
    get:
      description: Get the logo image for an organization (public, no auth required)
      operationId: getOrganizationLogo
      parameters:
      - description: Organization ID
        in: query
        name: organization_id
        required: true
        type: integer
      produces:
      - image/png
      - image/jpeg
      - image/webp
      - image/svg+xml
      responses:
        "200":
          description: Logo image
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get organization logo
      tags:
      - organizations
  /organization/printlogo:
    get:
      description: Get the print logo image for an organization (public, no auth required)
      operationId: getOrganizationLogoPrint
      parameters:
      - description: Organization ID
        in: query
        name: organization_id
        required: true
        type: integer
      produces:
      - image/png
      - image/jpeg
      - image/webp
      - image/svg+xml
      responses:
        "200":
          description: Print logo image
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get organization print logo
      tags:
      - organizations
  /organizations:
    get:
      description: Retrieve all organizations for the authenticated user with pagination
      operationId: getOrganizations
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Number of items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.OrganizationListAPIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get all organizations
      tags:
      - organizations
    post:
      consumes:
      - application/json
      description: Create a new organization with the provided information
      operationId: createOrganization
      parameters:
      - description: Organization information
        in: body
        name: organization
        required: true
        schema:
          $ref: '#/definitions/models.CreateOrganizationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.OrganizationAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new organization
      tags:
      - organizations
  /organizations/{id}:
    delete:
      description: Delete an organization by ID
      operationId: deleteOrganization
      parameters:
      - description: Organization ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.OrganizationDeleteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete an organization
      tags:
      - organizations
    get:
      description: Retrieve a specific organization by ID
      operationId: getOrganizationById
      parameters:
      - description: Organization ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.OrganizationAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get an organization by ID
      tags:
      - organizations
    put:
      consumes:
      - application/json
      description: Update an organization's information
      operationId: updateOrganization
      parameters:
      - description: Organization ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated organization information
        in: body
        name: organization
        required: true
        schema:
          $ref: '#/definitions/models.UpdateOrganizationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.OrganizationAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update an organization
      tags:
      - organizations
  /organizations/{id}/logo:
    post:
      consumes:
      - multipart/form-data
      description: Upload a new logo for the organization
      operationId: uploadOrganizationLogo
      parameters:
      - description: Organization ID
        in: path
        name: id
        required: true
        type: integer
      - description: Logo image (PNG, JPEG, WebP, SVG, max 10MB)
        in: formData
        name: logo
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.OrganizationAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload organization logo
      tags:
      - organizations
  /organizations/{id}/printlogo:
    post:
      consumes:
      - multipart/form-data
      description: Upload a new print logo for the organization
      operationId: uploadOrganizationLogoPrint
      parameters:
      - description: Organization ID
        in: path
        name: id
        required: true
        type: integer
      - description: Print logo image (PNG, JPEG, WebP, SVG, max 10MB)
        in: formData
        name: logo_print
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.OrganizationAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload organization print logo
      tags:
      - organizations
  /organizations/supported-formats:
    get:
      description: Get all supported date, time, and amount formats with examples
      operationId: getSupportedFormats
      produces:
      - application/json
      responses:
        "200":
          description: Supported formats with examples
          schema:
            additionalProperties: true
            type: object
      summary: Get supported formats
      tags:
      - organizations
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
