    type: object
  models.ErrorResponse:
    properties:
      code:
        type: integer
      details:
        type: string
      error:
        type: string
    type: object
  models.OrganizationAPIResponse:
    properties:
      data:
        $ref: '#/definitions/models.OrganizationResponse'
      message:
        example: Organization retrieved successfully
        type: string
      success:
        example: true
        type: boolean
    type: object
  models.OrganizationDeleteResponse:
    properties:
      message:
        example: Organization deleted successfully
        type: string
      success:
        example: true
        type: boolean
    type: object
  models.OrganizationListAPIResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/models.OrganizationResponse'
        type: array
      limit:
        example: 10
        type: integer
      message:
        example: Organizations retrieved successfully
        type: string
      page:
        example: 1
        type: integer
      success:
        example: true
        type: boolean
      total:
        example: 100
        type: integer
    type: object
  models.OrganizationResponse:
    properties:
      additional_payment_methods:
        type: object
      amount_format:
        type: string
      bankaccount_bank:
        type: string
