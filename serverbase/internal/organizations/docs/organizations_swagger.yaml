definitions:
  models.CreateOrganizationRequest:
    properties:
      additional_payment_methods:
        type: object
      bankaccount_bank:
        example: Deutsche Bank
        type: string
      bankaccount_bic:
        example: DEUTDEFF
        type: string
      bankaccount_iban:
        example: DE89370400440532013000
        type: string
      bankaccount_owner:
        example: Acme Corporation
        type: string
      city:
        example: New York
        type: string
      email:
        example: info@acme.com
        type: string
      invoice_content:
        type: object
      legal_notice_url:
        example: https://example.com/legal
        type: string
      name:
        example: Acme Corporation
        type: string
      owner_name:
        example: John Doe
        type: string
      owner_title:
        example: CEO
        type: string
      phone:
        example: +1-555-0123
        type: string
      privacy_policy_url:
        example: https://example.com/privacy
        type: string
      street_address:
        example: 123 Business St
        type: string
      tax_id:
        example: TAX123456
        type: string
      tax_rate:
        example: 19
        type: number
      tax_ustid:
        example: DE123456789
        type: string
      unit_price:
        example: 150
        type: number
      zip:
        example: "12345"
        type: string
