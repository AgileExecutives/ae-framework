              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AgileExecutives_ae-framework_serverbase_internal_models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_AgileExecutives_ae-framework_serverbase_internal_models.ErrorResponse'
      summary: User login
      tags:
      - authentication
  /auth/logout:
    post:
