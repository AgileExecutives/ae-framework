paths:
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Change password for authenticated user
      operationId: changePassword
      parameters:
      - description: Password change request
        in: body
        name: request
        required: true
        schema:
          properties:
            current_password:
              type: string
            new_password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_AgileExecutives_ae-framework_serverbase_internal_models.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AgileExecutives_ae-framework_serverbase_internal_models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_AgileExecutives_ae-framework_serverbase_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - authentication
  /auth/check-reset-token/{token}:
    get:
      description: Validate a password reset token to check if it's valid and not
        expired
      operationId: checkResetToken
      parameters:
      - description: Reset token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AgileExecutives_ae-framework_serverbase_internal_models.APIResponse'
            - properties:
                data:
                  properties:
                    email:
                      type: string
                    valid:
                      type: boolean
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AgileExecutives_ae-framework_serverbase_internal_models.ErrorResponse'
      summary: Check password reset token
      tags:
      - authentication
  /auth/check-verification-token/{token}:
    get:
      description: Validate an email verification token to check if it's valid and
        not expired
      operationId: checkVerificationToken
      parameters:
      - description: Verification token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AgileExecutives_ae-framework_serverbase_internal_models.APIResponse'
            - properties:
                data:
                  properties:
                    email:
                      type: string
                    user_id:
                      type: integer
                    valid:
                      type: boolean
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AgileExecutives_ae-framework_serverbase_internal_models.ErrorResponse'
      summary: Check email verification token
      tags:
      - authentication
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Send password reset email to user
      operationId: forgotPassword
      parameters:
      - description: User email
        in: body
        name: request
        required: true
        schema:
          properties:
            email:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_AgileExecutives_ae-framework_serverbase_internal_models.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AgileExecutives_ae-framework_serverbase_internal_models.ErrorResponse'
      summary: Request password reset
      tags:
      - authentication
  /auth/login:
    post:
      consumes:
